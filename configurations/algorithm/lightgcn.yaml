defaults:
  - base_cf

model:
  # Selected on validation/f1 only (2026-08-24 audit); the released 3-layer
  # default was paired with a sweep whose optimization metric was final_test/HR.
  num_layers: 2
  dropout: 0
  conv: LightGCN
  aggr: mean
  normalize: false

top_k: ${dataset.num_illicits}

test_every_n_epoch: 1
train_with_1_1: true
use_edge_index: true
