name: ngcf_val_only
program: main.py
method: grid

metric:
  goal: maximize
  name: validation/f1

parameters:
  # Exact candidate space from the historical NGCF tuning sweep.
  algorithm.model.num_layers:
    values: [1, 2, 3, 4]
  algorithm.model.dropout:
    values: [0.1, 0.2, 0.3]
  algorithm.model.normalize:
    values: [true, false]

  seed:
    values: [0, 1, 2]

  dataset:
    value: elliptic_recommendation
  algorithm:
    value: ngcf
  experiment:
    value: exp_edge_recommendation
  experiment.tasks:
    value: [training]
  experiment.training.batch_size:
    value: 1024
  experiment.validation.test_during_training:
    value: false
  experiment.training.checkpointing.monitor:
    value: validation/f1
  experiment.training.data.num_workers:
    value: 0
  experiment.validation.data.num_workers:
    value: 0
  wandb.mode:
    value: online

command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}
  - +name=ngcf_val_only_l${algorithm.model.num_layers}_d${algorithm.model.dropout}_n${algorithm.model.normalize}_s${seed}
