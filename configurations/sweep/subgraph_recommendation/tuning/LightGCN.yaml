name: lightgcn_sweep
program: main.py
method: grid # hp search method - maybe grid or random

metric:
  goal: maximize
  name: validation/f1

parameters:
  # Sweep params
  algorithm.model.num_layers:
    values: [1, 2, 3, 4]

  # Default params
  dataset:
    value: elliptic_recommendation
  algorithm:
    value: lightgcn
  experiment:
    value: exp_edge_recommendation
  experiment.tasks:
    value: [training]
  experiment.training.batch_size:
    value: 1024
  experiment.validation.batch_size:
    value: -1
  experiment.validation.test_during_training:
    value: False
  seed:
    value: 0
  wandb.mode:
    value: online
  +shortcut:
    value: 1+1@1
  +wandb.group:
    value: recommendation-v1
  +wandb.job_type:
    value: sweep

command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}
  - +name=lightgcn_sweep_${algorithm.model.num_layers}
