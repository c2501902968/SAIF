name: mlp_val_only
program: main.py
method: grid

# Architecture selection is validation-only.  TEST is absent from the task
# list and is not attached to validation during training.
metric:
  goal: maximize
  name: validation/f1

parameters:
  # Exact architecture candidate space from the historical MLP sweep.
  algorithm.model.num_layers:
    values: [1, 2]
  algorithm.model.hidden_dim:
    values: [64, 128]
  algorithm.model.dropout:
    values: [0.1, 0.2, 0.3]

  seed:
    values: [0, 1, 2]

  dataset:
    value: elliptic_recommendation
  algorithm:
    value: mlp
  experiment:
    value: exp_edge_recommendation
  experiment.tasks:
    value: [training]
  experiment.training.batch_size:
    value: 1024
  experiment.validation.test_during_training:
    value: false
  experiment.training.checkpointing.monitor:
    value: validation/f1
  experiment.training.data.num_workers:
    value: 0
  experiment.validation.data.num_workers:
    value: 0
  wandb.mode:
    value: online

command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}
  - +name=mlp_val_only_l${algorithm.model.num_layers}_h${algorithm.model.hidden_dim}_d${algorithm.model.dropout}_s${seed}
